<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Before and after: portfolio-series volatility only sees a correlation shift after it shows up in realised returns; the DCC path contracts the covariance matrix with the weights and reacts the same day.">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">Wiring DCC into VaR — what changes</text>
    <text x="24" y="48" font-size="11" fill="#5f6570">The difference is one edge: whether correlation reaches the risk number directly or via realised returns.</text>

    <line x1="450" y1="70" x2="450" y2="350" stroke="#d8dbe0"/>

    <!-- LEFT: before -->
    <text x="24" y="88" font-size="11" font-weight="bold">BEFORE — portfolio-series volatility</text>

    <rect x="24" y="104" width="90" height="34" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="42" y="126" font-size="11">asset A</text>
    <rect x="24" y="146" width="90" height="34" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="42" y="168" font-size="11">asset B</text>

    <rect x="150" y="122" width="110" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="160" y="139" font-size="11">w^T r_t</text>
    <text x="160" y="154" font-size="9" fill="#5f6570">collapse to one series</text>

    <rect x="296" y="122" width="120" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="306" y="139" font-size="11">GARCH on r_p</text>
    <text x="306" y="154" font-size="9" fill="#5f6570">→ VaR</text>

    <line x1="114" y1="121" x2="148" y2="136" stroke="#1a1a1a" marker-end="url(#a3)"/>
    <line x1="114" y1="163" x2="148" y2="148" stroke="#1a1a1a" marker-end="url(#a3)"/>
    <line x1="260" y1="142" x2="294" y2="142" stroke="#1a1a1a" marker-end="url(#a3)"/>

    <text x="24" y="206" font-size="10" fill="#a11f2c">Correlation is destroyed at the collapse step.</text>
    <text x="24" y="222" font-size="10" fill="#a11f2c">A regime shift reaches VaR only after it has</text>
    <text x="24" y="238" font-size="10" fill="#a11f2c">already moved realised portfolio volatility.</text>

    <!-- RIGHT: after -->
    <text x="474" y="88" font-size="11" font-weight="bold" fill="#1f4e79">AFTER — DCC covariance contracted with weights</text>

    <rect x="474" y="104" width="90" height="34" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="492" y="126" font-size="11">asset A</text>
    <rect x="474" y="146" width="90" height="34" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="492" y="168" font-size="11">asset B</text>

    <rect x="600" y="112" width="120" height="60" rx="3" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
    <text x="610" y="132" font-size="11" font-weight="bold" fill="#1f4e79">H_t</text>
    <text x="610" y="148" font-size="9" fill="#5f6570">D_t R_t D_t</text>
    <text x="610" y="163" font-size="9" fill="#5f6570">walk-forward</text>

    <rect x="756" y="122" width="112" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="766" y="139" font-size="11">σ²_p = w^T H_t w</text>
    <text x="766" y="154" font-size="9" fill="#5f6570">→ VaR</text>

    <line x1="564" y1="121" x2="598" y2="132" stroke="#1f4e79" stroke-width="2" marker-end="url(#a3b)"/>
    <line x1="564" y1="163" x2="598" y2="152" stroke="#1f4e79" stroke-width="2" marker-end="url(#a3b)"/>
    <line x1="720" y1="142" x2="754" y2="142" stroke="#1f4e79" stroke-width="2" marker-end="url(#a3b)"/>

    <text x="474" y="206" font-size="10" fill="#1a6b3c">Correlation survives to the risk number.</text>
    <text x="474" y="222" font-size="10" fill="#1a6b3c">VaR moves on the day the model detects the</text>
    <text x="474" y="238" font-size="10" fill="#1a6b3c">shift, not after the portfolio has lived through it.</text>

    <line x1="24" y1="266" x2="876" y2="266" stroke="#d8dbe0"/>
    <text x="24" y="292" font-size="11" font-weight="bold">Backtest result at 99%, demo panel</text>
    <text x="24" y="312" font-size="11" fill="#5f6570">dcc_portfolio: 29 breaches vs 26 expected · Kupiec p = 0.56 · Christoffersen p = 0.33 · Basel green</text>
    <text x="24" y="336" font-size="10" fill="#5f6570">rolling_dcc_covariance is used, not fit_dcc — the in-sample fit would leak the whole panel into every historical date.</text>
  </g>
</svg>
