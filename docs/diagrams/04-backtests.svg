<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Two VaR models with the same breach count: one scatters breaches and passes, the other clusters them and fails the independence test.">
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="339" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">Why counting breaches is not enough</text>
    <text x="24" y="48" font-size="11" fill="#5f6570">Both rows have 10 breaches in 250 days. Kupiec cannot tell them apart. Christoffersen can.</text>

    <!-- row A: scattered -->
    <text x="24" y="92" font-size="11" font-weight="bold">Adaptive model — breaches scattered</text>
    <rect x="24" y="102" width="760" height="34" fill="#f4f5f7" stroke="#d8dbe0"/>
    <g fill="#1a6b3c">
      <rect x="60" y="106" width="5" height="26"/><rect x="132" y="106" width="5" height="26"/>
      <rect x="196" y="106" width="5" height="26"/><rect x="268" y="106" width="5" height="26"/>
      <rect x="330" y="106" width="5" height="26"/><rect x="410" y="106" width="5" height="26"/>
      <rect x="486" y="106" width="5" height="26"/><rect x="556" y="106" width="5" height="26"/>
      <rect x="640" y="106" width="5" height="26"/><rect x="722" y="106" width="5" height="26"/>
    </g>
    <text x="796" y="123" font-size="11" fill="#1a6b3c">PASS</text>

    <!-- row B: clustered -->
    <text x="24" y="182" font-size="11" font-weight="bold">Static model — breaches clustered</text>
    <rect x="24" y="192" width="760" height="34" fill="#f4f5f7" stroke="#d8dbe0"/>
    <g fill="#a11f2c">
      <rect x="392" y="196" width="5" height="26"/><rect x="402" y="196" width="5" height="26"/>
      <rect x="412" y="196" width="5" height="26"/><rect x="422" y="196" width="5" height="26"/>
      <rect x="432" y="196" width="5" height="26"/><rect x="442" y="196" width="5" height="26"/>
      <rect x="452" y="196" width="5" height="26"/><rect x="462" y="196" width="5" height="26"/>
      <rect x="472" y="196" width="5" height="26"/><rect x="482" y="196" width="5" height="26"/>
    </g>
    <text x="796" y="213" font-size="11" fill="#a11f2c">FAIL</text>
    <text x="392" y="246" font-size="10" fill="#a11f2c">one volatile fortnight — the model never adapted</text>

    <line x1="24" y1="266" x2="876" y2="266" stroke="#d8dbe0"/>
    <text x="24" y="290" font-size="11"><tspan font-weight="bold">Kupiec</tspan> asks: right NUMBER of breaches?    both pass</text>
    <text x="24" y="310" font-size="11"><tspan font-weight="bold">Christoffersen</tspan> asks: are they INDEPENDENT?    only the top row passes</text>
    <text x="24" y="330" font-size="10" fill="#5f6570">Caveat in the code: at 99% breaches are sparse and the independence test is weak — run 95% and 97.5% too.</text>
  </g>
</svg>
