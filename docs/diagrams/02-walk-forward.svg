<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Walk-forward forecasting: the forecast for day t uses only returns before t. The fixed leak was the Student-t degrees of freedom being fitted on the whole sample.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a11f2c"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="339" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">Walk-forward, and the leak that was not</text>
    <text x="24" y="48" font-size="11" fill="#5f6570">Both the scale and the tail shape must come from data before the forecast date.</text>

    <!-- timeline -->
    <line x1="60" y1="120" x2="840" y2="120" stroke="#1a1a1a"/>
    <polygon points="840,116 850,120 840,124" fill="#1a1a1a"/>
    <text x="856" y="124" font-size="10" fill="#5f6570">time</text>

    <rect x="60" y="100" width="420" height="40" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="200" y="125" font-size="11">estimation window (returns &lt; t)</text>

    <line x1="480" y1="86" x2="480" y2="154" stroke="#1f4e79" stroke-width="2"/>
    <text x="486" y="96" font-size="11" font-weight="bold" fill="#1f4e79">t</text>

    <rect x="480" y="100" width="360" height="40" fill="#ffffff" stroke="#d8dbe0" stroke-dasharray="4 3"/>
    <text x="600" y="125" font-size="11" fill="#5f6570">not yet observed</text>

    <!-- correct arrows -->
    <path d="M270,100 L270,74 L470,74" fill="none" stroke="#1a6b3c" stroke-width="2" marker-end="url(#a2)"/>
    <text x="278" y="68" font-size="10" fill="#1a6b3c">σ_t  — variance forecast: correct</text>

    <!-- leak -->
    <path d="M700,140 L700,190 L490,190" fill="none" stroke="#a11f2c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a2r)"/>
    <text x="500" y="208" font-size="10" fill="#a11f2c">ν  — tail shape fitted on the FULL sample: leak (now fixed)</text>

    <line x1="24" y1="232" x2="876" y2="232" stroke="#d8dbe0"/>

    <text x="24" y="256" font-size="11" font-weight="bold">Why the original tests missed it</text>
    <text x="24" y="276" font-size="11" fill="#5f6570">They perturbed the last return and compared the VARIANCE series — which was honest.</text>
    <text x="24" y="294" font-size="11" fill="#5f6570">Nothing compared the VaR series, so the quantile leaked unobserved.</text>
    <text x="24" y="316" font-size="11" fill="#1a6b3c">Now: truncate the sample, recompute, and require every earlier VaR to be bit-identical.</text>
  </g>
</svg>
