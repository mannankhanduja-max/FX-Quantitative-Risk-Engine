<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="HistData reports zero volume, so a volume-weighted VWAP filter discards every row; tick counts restore a real VWAP and M1 bars fall back to a TWAP that is labelled as such.">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="359" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">The volume problem, and the two honest answers</text>
    <text x="24" y="48" font-size="11" fill="#5f6570">Spot FX has no consolidated tape. Every HistData Volume field is 0.</text>

    <!-- the bug -->
    <rect x="24" y="72" width="850" height="76" rx="3" fill="#ffffff" stroke="#a11f2c"/>
    <text x="36" y="94" font-size="11" font-weight="bold" fill="#a11f2c">The silent failure</text>
    <text x="36" y="114" font-size="11" font-family="Courier, monospace">valid_data = data[ ... &amp; (data["Volume"] &gt; 0) ]</text>
    <text x="36" y="136" font-size="11" fill="#5f6570">Volume is always 0 → valid_data is empty → rolling VWAP is NaN on every row. No error is raised.</text>

    <!-- branch -->
    <rect x="24" y="180" width="200" height="50" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="36" y="200" font-size="11" font-weight="bold">Tick files</text>
    <text x="36" y="218" font-size="10" fill="#5f6570">bid, ask, millisecond stamps</text>

    <rect x="300" y="180" width="200" height="50" rx="3" fill="#ffffff" stroke="#1a6b3c" stroke-width="2"/>
    <text x="312" y="200" font-size="11" font-weight="bold" fill="#1a6b3c">tick_count per bar</text>
    <text x="312" y="218" font-size="10" fill="#5f6570">quote intensity ≈ activity</text>

    <rect x="576" y="180" width="200" height="50" rx="3" fill="#ffffff" stroke="#1a6b3c" stroke-width="2"/>
    <text x="588" y="200" font-size="11" font-weight="bold" fill="#1a6b3c">true VWAP</text>
    <text x="588" y="218" font-size="10" fill="#5f6570">Σ p·n / Σ n</text>

    <line x1="224" y1="205" x2="298" y2="205" stroke="#1a1a1a" marker-end="url(#a6)"/>
    <line x1="500" y1="205" x2="574" y2="205" stroke="#1a1a1a" marker-end="url(#a6)"/>

    <rect x="24" y="256" width="200" height="50" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="36" y="276" font-size="11" font-weight="bold">M1 bars only</text>
    <text x="36" y="294" font-size="10" fill="#5f6570">no volume available</text>

    <rect x="300" y="256" width="476" height="50" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-dasharray="4 3"/>
    <text x="312" y="276" font-size="11" font-weight="bold">equal-weighted average → returned as `twap`, with a RuntimeWarning</text>
    <text x="312" y="294" font-size="10" fill="#5f6570">A TWAP is a legitimate benchmark. Calling it a VWAP is not. The code refuses to.</text>

    <line x1="224" y1="281" x2="298" y2="281" stroke="#1a1a1a" marker-end="url(#a6)"/>

    <text x="24" y="340" font-size="10" fill="#5f6570">Same reasoning drove the ETF universe proposal: ETFs report real share volume, FX spot does not.</text>
  </g>
</svg>
