<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Volume by source: FX spot on Yahoo reports zero and the VWAP is refused; HistData tick files supply a tick-count proxy; ETFs report real share volume, which is the default path feeding the twenty-day VWAP, its nine-period EMA and a signal shifted one bar.">
  <defs>
    <marker id="v6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="v6g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a6b3c"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="419" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">Volume decides whether a VWAP exists at all</text>
    <text x="24" y="48" font-size="11" fill="#5f6570">Spot FX has no consolidated tape, so there is nothing to weight by. Three sources, three different answers.</text>

    <!-- source column headers -->
    <text x="24" y="80" font-size="11" font-weight="bold" fill="#1f4e79">SOURCE</text>
    <text x="300" y="80" font-size="11" font-weight="bold" fill="#1f4e79">VOLUME FIELD</text>
    <text x="560" y="80" font-size="11" font-weight="bold" fill="#1f4e79">WHAT THE CODE DOES</text>

    <!-- row 1: FX spot on Yahoo -->
    <rect x="24" y="92" width="250" height="48" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="36" y="112" font-size="11" font-weight="bold">FX spot on Yahoo</text>
    <text x="36" y="129" font-size="10" fill="#5f6570">EURUSD=X and friends</text>

    <rect x="300" y="92" width="220" height="48" rx="3" fill="#ffffff" stroke="#a11f2c"/>
    <text x="312" y="112" font-size="11" font-weight="bold" fill="#a11f2c">always 0</text>
    <text x="312" y="129" font-size="10" fill="#5f6570">not missing — structurally absent</text>

    <rect x="560" y="92" width="316" height="48" rx="3" fill="#ffffff" stroke="#a11f2c"/>
    <text x="572" y="112" font-size="11" font-weight="bold" fill="#a11f2c">raises</text>
    <text x="572" y="129" font-size="10" fill="#5f6570">rolling_vwap refuses rather than divide by zero</text>

    <!-- row 2: HistData -->
    <rect x="24" y="156" width="250" height="48" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="36" y="176" font-size="11" font-weight="bold">HistData tick files</text>
    <text x="36" y="193" font-size="10" fill="#5f6570">bid, ask, millisecond stamps</text>

    <rect x="300" y="156" width="220" height="48" rx="3" fill="#ffffff" stroke="#a11f2c"/>
    <text x="312" y="176" font-size="11" font-weight="bold" fill="#a11f2c">always 0</text>
    <text x="312" y="193" font-size="10" fill="#5f6570">a &gt; 0 filter silently empties the frame</text>

    <rect x="560" y="156" width="316" height="48" rx="3" fill="#ffffff" stroke="#1a6b3c"/>
    <text x="572" y="176" font-size="11" font-weight="bold" fill="#1a6b3c">tick_count as a proxy</text>
    <text x="572" y="193" font-size="10" fill="#5f6570">quote intensity ≈ activity;  Σ p·n / Σ n</text>

    <!-- row 3: ETFs, the default -->
    <rect x="24" y="220" width="250" height="48" rx="3" fill="#ffffff" stroke="#1a6b3c" stroke-width="2"/>
    <text x="36" y="240" font-size="11" font-weight="bold" fill="#1a6b3c">ETFs — the default</text>
    <text x="36" y="257" font-size="10" fill="#5f6570">FXE, FXB, FXY, FXF, GLD</text>

    <rect x="300" y="220" width="220" height="48" rx="3" fill="#ffffff" stroke="#1a6b3c" stroke-width="2"/>
    <text x="312" y="240" font-size="11" font-weight="bold" fill="#1a6b3c">real share volume</text>
    <text x="312" y="257" font-size="10" fill="#5f6570">one exchange, one closing auction</text>

    <rect x="560" y="220" width="316" height="48" rx="3" fill="#ffffff" stroke="#1a6b3c" stroke-width="2"/>
    <text x="572" y="240" font-size="11" font-weight="bold" fill="#1a6b3c">a genuine volume weighting</text>
    <text x="572" y="257" font-size="10" fill="#5f6570">rolling, on daily bars — not the intraday benchmark</text>

    <line x1="274" y1="116" x2="298" y2="116" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="520" y1="116" x2="558" y2="116" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="274" y1="180" x2="298" y2="180" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="520" y1="180" x2="558" y2="180" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="274" y1="244" x2="298" y2="244" stroke="#1a6b3c" stroke-width="2" marker-end="url(#v6g)"/>
    <line x1="520" y1="244" x2="558" y2="244" stroke="#1a6b3c" stroke-width="2" marker-end="url(#v6g)"/>

    <!-- construction strip -->
    <line x1="24" y1="292" x2="876" y2="292" stroke="#d8dbe0"/>
    <text x="24" y="314" font-size="11" font-weight="bold" fill="#1f4e79">FROM VOLUME TO A TRADEABLE SIGNAL</text>

    <rect x="24" y="326" width="196" height="52" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="34" y="345" font-size="11">VWAP, 20 bars</text>
    <text x="34" y="361" font-size="10" fill="#5f6570">Σ TP·V / Σ V,  TP = (H+L+C)/3</text>

    <rect x="252" y="326" width="196" height="52" rx="3" fill="#f4f5f7" stroke="#1a1a1a"/>
    <text x="262" y="345" font-size="11">EMA, span 9</text>
    <text x="262" y="361" font-size="10" fill="#5f6570">α = 0.2,  adjust = False</text>

    <rect x="480" y="326" width="196" height="52" rx="3" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="490" y="345" font-size="11">sign(EMA − VWAP)</text>
    <text x="490" y="361" font-size="10" fill="#5f6570">shifted 1 bar → knowable at t−1</text>

    <rect x="708" y="326" width="168" height="52" rx="3" fill="#ffffff" stroke="#7a8089" stroke-dasharray="4 3"/>
    <text x="718" y="345" font-size="10" fill="#5f6570">flat on 0.4% of days:</text>
    <text x="718" y="361" font-size="10" fill="#5f6570">effectively always ±1</text>

    <line x1="220" y1="352" x2="250" y2="352" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="448" y1="352" x2="478" y2="352" stroke="#1a1a1a" marker-end="url(#v6)"/>
    <line x1="676" y1="352" x2="706" y2="352" stroke="#7a8089" marker-end="url(#v6)"/>

    <text x="24" y="402" font-size="10" fill="#5f6570">A TWAP is a legitimate benchmark. Calling it a VWAP is not, and the code refuses to.</text>
  </g>
</svg>
