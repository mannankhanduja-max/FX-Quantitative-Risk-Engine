<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="The risk-free rate is annual and must be de-annualised before subtracting from daily returns; Sortino measures downside against that rate rather than zero.">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="339" fill="none" stroke="#d8dbe0"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="24" y="30" font-size="13" font-weight="bold">Two Sharpe mistakes the code refuses to make</text>

    <!-- 1 -->
    <text x="24" y="66" font-size="11" font-weight="bold">1. The risk-free rate is annual; returns are daily</text>

    <rect x="24" y="80" width="180" height="40" rx="3" fill="#ffffff" stroke="#a11f2c"/>
    <text x="34" y="98" font-size="10" fill="#a11f2c">wrong</text>
    <text x="34" y="113" font-size="10" font-family="Courier, monospace">r_daily − 0.04</text>

    <rect x="240" y="80" width="230" height="40" rx="3" fill="#ffffff" stroke="#1a6b3c"/>
    <text x="250" y="98" font-size="10" fill="#1a6b3c">right</text>
    <text x="250" y="113" font-size="10" font-family="Courier, monospace">r_daily − ((1+0.04)^(1/252) − 1)</text>

    <text x="500" y="98" font-size="10" fill="#5f6570">0.04 vs 0.000156</text>
    <text x="500" y="113" font-size="10" fill="#a11f2c">a factor-252 error, and a common one</text>

    <!-- 2 -->
    <text x="24" y="164" font-size="11" font-weight="bold">2. Sortino measures downside against the MAR, not zero</text>

    <line x1="60" y1="248" x2="600" y2="248" stroke="#1a1a1a"/>
    <line x1="200" y1="196" x2="200" y2="256" stroke="#5f6570" stroke-dasharray="3 3"/>
    <text x="176" y="272" font-size="10" fill="#5f6570">0</text>
    <line x1="300" y1="196" x2="300" y2="256" stroke="#1f4e79" stroke-width="2"/>
    <text x="272" y="272" font-size="10" fill="#1f4e79">MAR = rf</text>

    <rect x="200" y="208" width="100" height="32" fill="#f4f5f7" stroke="#a11f2c" stroke-dasharray="3 2"/>
    <text x="308" y="205" font-size="10" fill="#a11f2c">returns in this band are positive but BELOW the</text>
    <text x="308" y="220" font-size="10" fill="#a11f2c">risk-free rate — downside that a zero threshold misses</text>

    <text x="620" y="215" font-size="10" fill="#5f6570">Using zero makes Sortino</text>
    <text x="620" y="230" font-size="10" fill="#5f6570">non-comparable with the</text>
    <text x="620" y="245" font-size="10" fill="#5f6570">Sharpe printed beside it.</text>

    <line x1="24" y1="290" x2="876" y2="290" stroke="#d8dbe0"/>
    <text x="24" y="314" font-size="11" fill="#5f6570">Annualising by √252 assumes iid returns. `sharpe_ratio` also returns the un-annualised value so the assumption stays visible.</text>
    <text x="24" y="332" font-size="10" fill="#5f6570">Zero volatility returns NaN, not 0 — an undefined Sharpe is reported as undefined.</text>
  </g>
</svg>
